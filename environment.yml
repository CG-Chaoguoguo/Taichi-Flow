name: taichi-flow
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - numpy>=1.24,<3.0
  - scipy>=1.10,<2.0
  - pandas>=2.0,<4.0
  - rasterio>=1.3,<2.0
  - geopandas>=0.12,<2.0
  - pyproj>=3.4,<4.0
  - shapely>=2.0,<3.0
  - pip:
      - taichi>=1.7.4,<1.8.0
      - fastapi>=0.100.0,<1.0.0
      - httpx>=0.24.0,<1.0.0
      - uvicorn[standard]>=0.23.0,<1.0.0
      - websockets>=11.0,<17.0
      - websocket-client>=1.8.0,<2.0.0
      - python-multipart>=0.0.6,<1.0.0
      - pydantic>=2.0,<3.0
      - pyyaml>=6.0,<7.0
      - python-dotenv>=1.0,<2.0
      - psutil>=5.9,<6.0
      - tqdm>=4.65,<5.0
      - pytest>=7.4,<10.0
      - pytest-cov>=4.1,<7.0
      - black>=23.0,<27.0
      - mypy>=1.5,<2.0
      - flake8>=6.0,<8.0
