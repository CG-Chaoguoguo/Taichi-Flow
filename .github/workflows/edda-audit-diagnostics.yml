name: EDDA isolated audit diagnostics
on:
  push:
    branches: [audit/edda-parity-pro-20260916]
    paths: [.github/workflows/edda-audit-diagnostics.yml]
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download CPU-test runtime for offline reproduction
        run: python -m pip download --only-binary=:all: 'taichi>=1.7.4,<1.8.0' --dest audit-runtime
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record dependency advisories without changing the lockfile
        working-directory: frontend/taichi-flow
        shell: bash
        run: |
          npm audit --json > ../../audit-runtime/npm-audit.json || status=$?
          test "${status:-0}" -le 1
          git diff --exit-code -- package.json package-lock.json
      - name: Freeze evidence hashes
        run: |
          git rev-parse HEAD > audit-runtime/source-sha.txt
          sha256sum audit-runtime/*.whl > audit-runtime/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: edda-audit-runtime
          path: audit-runtime/
          retention-days: 3
