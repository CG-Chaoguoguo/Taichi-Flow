name: Publish validated EDDA audit sources
on:
  push:
    branches: [audit/edda-parity-pro-20260916]
    paths: [.github/workflows/edda-audit-promote.yml]
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'CG-Chaoguoguo/Taichi-Flow' && github.ref == 'refs/heads/audit/edda-parity-pro-20260916'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply the exact patch already passing fourteen tests in runs 35123467871 and 35123845897
        run: |
          mkdir -p audit-validation
          python - <<'PY'
          import base64, gzip, hashlib, pathlib, subprocess
          data = b''.join(pathlib.Path(f'.github/audit/edda-parity.part{i}.b64').read_bytes().strip() for i in range(4))
          patch = gzip.decompress(base64.b64decode(data, validate=True))
          assert len(patch) == 41118
          assert hashlib.sha256(patch).hexdigest() == 'b8ecc656328ebf87f81bb34bf11b5caf9dee5252c9c4f8aadc6daa8fa8393395'
          path = pathlib.Path('audit-validation/numerical.patch')
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '--index', str(path)], check=True)
          subprocess.run(['git', 'apply', '--index', str(path)], check=True)
          PY
          cp .github/workflows/edda-parity-audit.yml audit-validation/final-ci.yml
          git restore --staged -- .github/workflows/edda-parity-audit.yml
          python -m compileall -q edda api
          git diff --cached --check
      - name: Publish source-only commit without changing workflow permissions
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/audit/edda-parity-pro-20260916 | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve EDDA retry Cv and rejection boundaries, validate restarts and fail incomplete runs'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/audit/edda-parity-pro-20260916
          git rev-parse HEAD > audit-validation/scientific-commit.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve patched dependencies with the npm 11 toolchain
        working-directory: frontend/taichi-flow
        run: |
          npm install --global npm@11
          npm --version > ../../audit-validation/npm-version.txt
          npm ci
          npm install --save-dev 'vitest@4.1.11' --ignore-scripts
          npm audit fix --ignore-scripts
          npm ci
          npm audit --json > ../../audit-validation/npm-audit-after.json
          npm test
          npm run test:desktop
          npm run build
      - name: Publish dependency repair only after audit and build succeed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected=$(git rev-parse HEAD)
          test "$(git ls-remote origin refs/heads/audit/edda-parity-pro-20260916 | cut -f1)" = "$expected"
          git add -- frontend/taichi-flow/package.json frontend/taichi-flow/package-lock.json
          git diff --cached --check
          git diff --cached --stat > audit-validation/dependency-diff-stat.txt
          git commit -m 'fix(deps): patch Vitest mocker and transitive dependency advisories'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/audit/edda-parity-pro-20260916
          git rev-parse HEAD > audit-validation/validated-commit.txt
          cp frontend/taichi-flow/package{,-lock}.json audit-validation/
          cp -r frontend/taichi-flow/dist audit-validation/
      - name: Preserve dependency diagnostics
        if: always()
        run: |
          mkdir -p audit-validation/npm-logs
          cp -f "$HOME"/.npm/_logs/*debug-0.log audit-validation/npm-logs/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edda-audit-published-${{ github.run_id }}
          path: audit-validation/
          retention-days: 14
