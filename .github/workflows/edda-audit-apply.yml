name: Apply audited EDDA continuation patch
on:
  push:
    branches: [audit/edda-parity-pro-20260916]
    paths: [.github/workflows/edda-audit-apply.yml]
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'CG-Chaoguoguo/Taichi-Flow' && github.ref == 'refs/heads/audit/edda-parity-pro-20260916'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply readable migration and verify all nine output hashes
        shell: bash
        run: |
          python scripts/_edda_audit_apply_once.py
          git add edda/solver/dfs_dynamic_wave.py edda/solver/native_unsfin/analytic_cell.py tests/test_dfs_dynamic_wave.py tests/test_native_input_chain.py tests/test_runtime_source_chain_diagnostics.py tests/test_solver.py tests/test_system_directories.py tests/test_time_integration_consistency.py tests/test_zone_system.py
          python -m compileall -q edda api scripts
          git diff --cached --check
          python - <<'PY'
          import subprocess
          allowed = {'edda/solver/dfs_dynamic_wave.py','edda/solver/native_unsfin/analytic_cell.py','tests/test_dfs_dynamic_wave.py','tests/test_native_input_chain.py','tests/test_runtime_source_chain_diagnostics.py','tests/test_solver.py','tests/test_system_directories.py','tests/test_time_integration_consistency.py','tests/test_zone_system.py'}
          changed = set(subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines())
          assert changed == allowed, (changed, allowed)
          PY
      - name: Non-force commit only when the branch has not moved
        shell: bash
        run: |
          branch=audit/edda-parity-pro-20260916
          git fetch origin "$branch"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: align face-owner carry and f64 flux diagnostics; repair stale test contracts'
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD > applied-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: edda-continuation-applied-${{ github.run_id }}
          path: applied-commit.txt
          retention-days: 7
