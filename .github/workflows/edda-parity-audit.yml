name: EDDA parity audit

on:
  pull_request:
    branches: [Pro-Quick-Chat, gpt-edda-switch-parity]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edda-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: CG-Chaoguoguo/EDDA-Fortran
          ref: 8b0b7cf4b64266f941ae87daaae7f86eaf7d7630
          path: .oracle-source
          persist-credentials: false
      - name: Freeze source-only audit evidence
        shell: bash
        run: |
          mkdir -p audit-evidence
          git rev-parse HEAD > audit-evidence/candidate-sha.txt
          git -C .oracle-source rev-parse HEAD > audit-evidence/oracle-sha.txt
          git archive --format=tar.gz HEAD > audit-evidence/candidate-source.tar.gz
          git -C .oracle-source archive --format=tar.gz HEAD > audit-evidence/oracle-source.tar.gz
          sha256sum audit-evidence/*.tar.gz > audit-evidence/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: edda-audit-source-${{ github.run_id }}
          path: audit-evidence/
          retention-days: 14

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      TAICHI_FLOW_STATE_DIR: ${{ github.workspace }}/.runtime/ci-audit
      CI_SHARD: ${{ matrix.shard }}
      TI_CPU_MAX_NUM_THREADS: '2'
      TQDM_DISABLE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Compile backend
        run: python -m compileall -q edda api
      - name: Run complete node-disjoint backend shard
        run: python scripts/edda_audit_ci.py run --index ${{ matrix.shard }} --count 4 --output audit-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edda-audit-backend-${{ matrix.shard }}-${{ github.run_id }}
          path: audit-ci/
          if-no-files-found: error
          retention-days: 14

  backend-inventory:
    needs: backend
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: edda-audit-backend-*-${{ github.run_id }}
          path: audit-ci
          merge-multiple: true
      - name: Require every collected node exactly once and zero failures
        run: python scripts/edda_audit_ci.py verify audit-ci --count 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edda-audit-coverage-${{ github.run_id }}
          path: audit-ci/coverage-summary.json
          retention-days: 14

  native-input-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      TAICHI_FLOW_STATE_DIR: ${{ github.workspace }}/.runtime/edda-input-audit
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_native_unsfin_input_identity.py tests/test_native_unsfin_analytic_cell.py tests/test_system_directories.py --junitxml=windows-input-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edda-audit-windows-input-${{ github.run_id }}
          path: windows-input-tests.xml
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/taichi-flow
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/taichi-flow/package-lock.json
      - name: Pin validated npm dependency resolver
        run: npm install --global npm@11.19.1
      - run: npm ci
      - run: npm test
      - run: npm run test:desktop
      - run: npm run build
      - name: Audit dependency lockfile
        run: npm audit --json > npm-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edda-audit-frontend-${{ github.run_id }}
          path: |
            frontend/taichi-flow/dist/
            frontend/taichi-flow/npm-audit.json
          retention-days: 14
