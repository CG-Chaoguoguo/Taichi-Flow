name: EDDA parity audit

on:
  pull_request:
    branches: [Pro-Quick-Chat, gpt-edda-switch-parity]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edda-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: CG-Chaoguoguo/EDDA-Fortran
          ref: 8b0b7cf4b64266f941ae87daaae7f86eaf7d7630
          path: .oracle-source
          persist-credentials: false
      - name: Freeze source-only audit evidence
        shell: bash
        run: |
          mkdir -p audit-evidence
          git rev-parse HEAD > audit-evidence/candidate-sha.txt
          git -C .oracle-source rev-parse HEAD > audit-evidence/oracle-sha.txt
          git archive --format=tar.gz HEAD > audit-evidence/candidate-source.tar.gz
          git -C .oracle-source archive --format=tar.gz HEAD > audit-evidence/oracle-source.tar.gz
          sha256sum audit-evidence/*.tar.gz > audit-evidence/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: edda-audit-source-${{ github.run_id }}
          path: audit-evidence/
          retention-days: 14

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      TAICHI_FLOW_STATE_DIR: ${{ github.workspace }}/.runtime/ci-audit
      CI_SHARD: ${{ matrix.shard }}
      TI_CPU_MAX_NUM_THREADS: '2'
      TQDM_DISABLE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Compile backend
        run: python -m compileall -q edda api
      - name: Collect test contracts
        run: python -m pytest --collect-only -q
      - name: Run backend and domain regression tests
        shell: bash
        run: |
          python - <<'PYTEST'
          import os, pathlib, subprocess, sys
          files = sorted(str(p) for p in pathlib.Path('tests').rglob('test_*.py'))
          selected = files[int(os.environ['CI_SHARD'])::4]
          if not selected:
              raise SystemExit('Empty CI shard: refusing a vacuous pass')
          pathlib.Path('backend-test-selection.txt').write_text('\n'.join(selected) + '\n')
          raise SystemExit(subprocess.run([
              sys.executable, '-m', 'pytest', '-q', '--maxfail=10',
              '--junitxml=backend-tests.xml', *selected,
          ]).returncode)
          PYTEST
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edda-audit-backend-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            backend-tests.xml
            backend-test-selection.txt
          if-no-files-found: warn
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/taichi-flow
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/taichi-flow/package-lock.json
      - name: Pin validated npm dependency resolver
        run: npm install --global npm@11.19.1
      - run: npm ci
      - run: npm test
      - run: npm run test:desktop
      - run: npm run build
      - name: Audit dependency lockfile
        run: npm audit --json > npm-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: edda-audit-frontend-${{ github.run_id }}
          path: |
            frontend/taichi-flow/dist/
            frontend/taichi-flow/npm-audit.json
          retention-days: 14
