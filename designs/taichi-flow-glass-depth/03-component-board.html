<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taichi-Flow — Component Board (Glass Depth)</title>
  <link rel="stylesheet" href="_shared.css" />
  <style>
    .board { max-width: 960px; margin: 0 auto; padding: var(--space-page); }
    .section { margin-bottom: var(--space-7); }
    .section-title { margin-bottom: var(--space-4); color: var(--color-foreground-tertiary); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; }
    .row { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; }
    .icon-btn {
      width: 34px; height: 34px; border-radius: var(--radius-medium);
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--glass-bg-subtle); border: 1px solid var(--glass-border);
      color: var(--color-foreground-secondary); cursor: pointer;
      transition: all var(--motion-fast);
    }
    .icon-btn:hover { background: var(--color-surface-tertiary); }
    .icon-btn.active { background: var(--color-brand-bg-subtle); color: var(--color-brand); border-color: rgba(113,112,255,0.3); }
    .input-demo {
      height: 36px; padding: 0 12px; border-radius: var(--radius-medium);
      background: var(--glass-bg-subtle); border: 1px solid var(--glass-border);
      color: var(--color-foreground); min-width: 200px;
    }
    .toast {
      padding: 12px 16px; border-radius: var(--radius-large);
      background: var(--glass-bg); backdrop-filter: blur(var(--blur-glass));
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-modal);
      display: flex; align-items: center; gap: 10px; max-width: 360px;
    }
    .dialog-overlay {
      position: relative; height: 280px; border-radius: var(--radius-large);
      background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center;
    }
    .dialog {
      width: min(480px, 90%); padding: var(--space-5);
      border-radius: var(--radius-xlarge);
      background: var(--glass-bg); backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border); box-shadow: var(--shadow-modal);
    }
  </style>
</head>
<body>
  <div class="board tf-animate-in">
    <h1 class="tf-title" style="margin-bottom:var(--space-2)">Component Board</h1>
    <p class="tf-caption" style="color:var(--color-foreground-secondary);margin-bottom:var(--space-7)">Glass Depth 设计系统组件一览</p>

    <section class="section">
      <h2 class="section-title">Buttons</h2>
      <div class="row">
        <button class="btn btn-primary">Primary</button>
        <button class="btn btn-secondary">Secondary</button>
        <button class="btn btn-ghost">Ghost</button>
        <button class="btn btn-primary" style="opacity:0.5;cursor:not-allowed">Disabled</button>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title">Icon Buttons</h2>
      <div class="row">
        <button class="icon-btn">☀</button>
        <button class="icon-btn active">🌙</button>
        <button class="icon-btn">⚙</button>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title">Status Badges</h2>
      <div class="row">
        <span class="badge"><span class="badge-dot" style="background:var(--color-foreground-tertiary)"></span>草稿</span>
        <span class="badge"><span class="badge-dot" style="background:var(--color-info)"></span>待模拟</span>
        <span class="badge"><span class="badge-dot" style="background:var(--color-brand)"></span>运行中</span>
        <span class="badge"><span class="badge-dot" style="background:var(--color-success)"></span>已完成</span>
        <span class="badge"><span class="badge-dot" style="background:var(--color-error)"></span>失败</span>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title">Inputs</h2>
      <input class="input-demo" placeholder="搜索项目…" value="" />
    </section>

    <section class="section">
      <h2 class="section-title">Surfaces</h2>
      <div class="row" style="align-items:stretch">
        <div class="tf-panel" style="flex:1;min-height:80px"><p class="tf-body">Glass Panel</p></div>
        <div class="tf-panel tf-elevated" style="flex:1;min-height:80px"><p class="tf-body">Elevated Panel</p></div>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title">Toast</h2>
      <div class="toast">
        <span class="badge-dot" style="background:var(--color-success)"></span>
        <span class="tf-body" style="flex:1">方案已保存</span>
        <button class="btn btn-ghost" style="width:28px;height:28px;padding:0">✕</button>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title">Dialog</h2>
      <div class="dialog-overlay">
        <div class="dialog">
          <h3 class="tf-subtitle" style="margin-bottom:8px">选择本机目录</h3>
          <p class="tf-caption" style="color:var(--color-foreground-secondary);margin-bottom:var(--space-4)">浏览本机盘符并选择要导入的文件夹。</p>
          <div class="row" style="justify-content:flex-end">
            <button class="btn btn-secondary">取消</button>
            <button class="btn btn-primary">选择此文件夹</button>
          </div>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
