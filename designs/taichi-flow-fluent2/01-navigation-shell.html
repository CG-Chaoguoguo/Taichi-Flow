<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taichi-Flow — NavigationView Shell (Fluent 2)</title>
  <link rel="stylesheet" href="_shared.css" />
  <style>
    .app { display: flex; height: 100vh; overflow: hidden; background: var(--mica-base); }
    .nav-pane {
      width: var(--nav-width); flex-shrink: 0;
      display: flex; flex-direction: column;
      background: var(--mica-alt);
      border-right: 1px solid var(--layer-stroke);
    }
    .nav-brand {
      height: var(--header-height); display: flex; align-items: center; gap: 10px;
      padding: 0 12px; border-bottom: 1px solid var(--layer-stroke); flex-shrink: 0;
    }
    .nav-brand .tf-subtitle { font-size: 14px; font-weight: 600; }
    .logo {
      width: 24px; height: 24px; border-radius: var(--radius-control);
      background: var(--color-brand); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 10px;
    }
    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .topbar {
      height: var(--header-height); flex-shrink: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 var(--space-5);
      background: var(--mica-base);
      border-bottom: 1px solid var(--layer-stroke);
    }
    .content { flex: 1; overflow: auto; padding: var(--space-page); background: var(--mica-base); }
    .page-header { margin-bottom: var(--space-6); display: flex; justify-content: space-between; align-items: flex-end; }
    .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-section); margin-bottom: var(--space-6); }
    .metric { font-size: 28px; font-weight: 600; letter-spacing: -0.4px; }
    .chip {
      padding: 2px 8px; border-radius: var(--radius-control);
      background: var(--layer-on-acrylic); border: 1px solid var(--layer-stroke);
      font-size: 12px; color: var(--color-foreground-secondary);
    }
    .project-list { display: grid; gap: var(--space-3); }
    .project-card {
      padding: var(--space-4); border-radius: var(--radius-card);
      background: var(--layer-fill-default); border: 1px solid var(--layer-stroke);
      box-shadow: var(--shadow-2); cursor: pointer;
      transition: box-shadow var(--motion-fast) var(--ease-standard);
    }
    .project-card:hover { box-shadow: var(--shadow-8); }
    .project-card.active { outline: 1px solid var(--color-brand); }
  </style>
</head>
<body>
  <div class="app tf-animate-in">
    <aside class="nav-pane">
      <div class="nav-brand">
        <div class="logo">TF</div>
        <span class="tf-subtitle">Taichi-Flow</span>
      </div>
      <nav style="flex:1;padding:8px 0;display:flex;flex-direction:column;gap:2px">
        <button class="nav-item active">📁 项目</button>
        <button class="nav-item">📋 方案</button>
        <button class="nav-item">🧮 计算</button>
        <button class="nav-item">📜 队列</button>
        <button class="nav-item">⬇ 导出</button>
      </nav>
      <div style="border-top:1px solid var(--layer-stroke);padding:8px 0">
        <button class="nav-item">⚙ 设置</button>
        <button class="nav-item">◀ 收起侧栏</button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="tf-row" style="min-width:0;flex:1">
          <span class="tf-subtitle">三峡库区洪水演进</span>
          <span class="tf-caption">D:\Projects\sanxia-flood</span>
          <span class="chip">输入版本由当前场景修订决定</span>
        </div>
        <div class="tf-row">
          <span class="tf-caption">CPU 12% · GPU 4%</span>
          <span class="tf-badge"><span class="tf-badge-dot" style="background:var(--color-success)"></span>服务在线</span>
          <span class="tf-caption">22:45:08</span>
        </div>
      </header>

      <div class="content">
        <div class="page-header">
          <div>
            <h1 class="tf-title">项目</h1>
            <p class="tf-caption" style="margin-top:4px">管理本地工程目录与近期工作台状态</p>
          </div>
          <div class="tf-row">
            <button class="tf-btn tf-btn-secondary">打开项目</button>
            <button class="tf-btn tf-btn-primary">新建项目</button>
          </div>
        </div>

        <div class="card-grid">
          <div class="tf-layer" style="padding:20px">
            <div class="tf-caption">方案总数</div>
            <div class="metric">12</div>
          </div>
          <div class="tf-layer" style="padding:20px">
            <div class="tf-caption">运行中任务</div>
            <div class="metric">2</div>
          </div>
          <div class="tf-layer" style="padding:20px">
            <div class="tf-caption">已完成</div>
            <div class="metric">8</div>
          </div>
          <div class="tf-layer" style="padding:20px">
            <div class="tf-caption">失败 / 中断</div>
            <div class="metric">1</div>
          </div>
        </div>

        <div class="project-list">
          <div class="project-card active">
            <div class="tf-row" style="justify-content:space-between">
              <span class="tf-subtitle">三峡库区洪水演进</span>
              <span class="tf-badge">活跃</span>
            </div>
            <p class="tf-caption" style="margin-top:8px">D:\Projects\sanxia-flood · 最近打开 10 分钟前</p>
          </div>
          <div class="project-card">
            <div class="tf-row" style="justify-content:space-between">
              <span class="tf-subtitle">洞庭湖联合调度</span>
              <span class="tf-badge">草稿</span>
            </div>
            <p class="tf-caption" style="margin-top:8px">D:\Projects\dongting · 最近打开 昨天</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
