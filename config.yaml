# ================================================================
#  EDDA-Taichi 模拟配置文件
# ================================================================
#  使用方法: 修改本文件中的参数和文件路径，然后运行
#    python run.py
#  或
#    python run.py --config config.yaml
# ================================================================


# ================================================================
#  输入文件
# ================================================================

# [必须] DEM地形文件
#   格式: GeoTIFF (.tif)
#   要求: 带坐标参考系(CRS)，裁剪区域外设为NoData
dem_file: "tests/data/DEM.tif"

# [必须] 降雨数据
rainfall:
  # 降雨输入模式:
  #   spatial_tif_series - 空间降雨TIF序列（推荐，每个文件一个时间步）
  #   single_file        - 单个文件（CSV或TXT，均匀降雨）
  mode: "spatial_tif_series"

  # --- spatial_tif_series 模式 ---
  # 降雨TIF文件所在目录
  directory: "tests/data"
  # 文件匹配模式（按文件名排序确定时间顺序）
  file_pattern: "caiyun_precip_*.tif"
  # 相邻文件之间的时间间隔（小时）
  time_step_hours: 1.0

  # --- single_file 模式 ---
  # file: "tests/data/rainfall.csv"

# [可选] 边界条件文件
#   格式: Shapefile (.shp) 或 GeoTIFF (.tif)
#   用途: 定义出流/入流位置
#   不提供时自动检测（网格边缘 + NoData区域 = 出流边界）
boundary_conditions:
  mode: "auto"                # auto | file
  include_nodata: true        # 将NoData区域作为出流边界
  # boundary_file: "path/to/boundary.shp"  # mode=file 时取消注释

# [可选] 空间分区文件
#   格式: GeoTIFF (.tif)，像元值为分区编号(整数)
#   用途: 不同区域使用不同的土壤/水文/流变参数
#   不提供时全域使用统一参数
spatial_zones: null
  # enabled: true
  # zone_file: "path/to/zones.tif"
  # num_zones: 3
  # zones:
  #   1:                        # 分区1的参数
  #     zone_id: 1
  #     K_sat: 1.0e-5
  #     theta_s: 0.45
  #     theta_i: 0.20
  #     psi_f: 0.10
  #     c: 5000.0
  #     phi: 30.0
  #     gamma_s: 20000.0
  #     gamma_w: 9800.0
  #     depth: 2.0
  #     n_manning: 0.05
  #     alpha1: 0.0765
  #     beta1: 10.11
  #     alpha2: 0.0538
  #     beta2: 17.48
  #   2:                        # 分区2的参数
  #     zone_id: 2
  #     K_sat: 5.0e-6
  #     ...


# ================================================================
#  输出设置
# ================================================================

output_dir: "./output"
output_format: "geotiff"      # geotiff | netcdf
save_intermediate: true        # 是否保存中间时间步结果


# ================================================================
#  时间参数
# ================================================================

time:
  t_start: 0.0                # 起始时间 (秒)
  t_end: 86400.0              # 结束时间 (秒)，86400 = 24小时
  dt_initial: 1.0             # 初始时间步长 (秒)
  dt_min: 0.01                # 最小时间步长 (秒)
  dt_max: 10.0                # 最大时间步长 (秒)
  dt_output: 3600.0           # 输出间隔 (秒)，3600 = 1小时
  CFL: 0.5                    # CFL稳定性系数


# ================================================================
#  土壤参数
# ================================================================

soil:
  c: 5000.0                   # 粘聚力 (Pa)
  phi: 30.0                   # 内摩擦角 (度)
  gamma_s: 20000.0            # 土壤容重 (N/m³)
  gamma_w: 9800.0             # 水容重 (N/m³)
  depth: 2.0                  # 土层厚度 (m)

  # [可选] 双层土壤模型 (Richards方程，26子层)
  # 不启用时使用上面的单层简化模型
  double_layer: null
    # enabled: true
    # nzst: 26                  # 上层子层数
    # nzsb: 26                  # 下层子层数
    # zmin: 0.01                # 最小层厚 (m)
    # uww: 0.0                  # 初始地下水位深度 (m, 0=地表)
    # nudzt: [0.01, 0.01, ...]  # 上层各子层厚度 (m)，共nzst个
    # nudzb: [0.01, 0.01, ...]  # 下层各子层厚度 (m)，共nzsb个
    # top_layer:                # 上层参数
    #   c: 5000.0               # 粘聚力 (Pa)
    #   phi: 30.0               # 内摩擦角 (度)
    #   phib: 15.0              # 基底摩擦角 (度)
    #   gamma_s: 20000.0        # 土壤容重 (N/m³)
    #   K_sat: 1.0e-5           # 饱和渗透系数 (m/s)
    #   theta_sat: 0.45         # 饱和含水率
    #   theta_res: 0.05         # 残余含水率
    #   theta_ini: 0.20         # 初始含水率
    #   alpha: 2.0              # Van Genuchten参数 α (1/m)
    #   diffusivity: 1.0e-6     # 土壤水扩散系数 (m²/s)
    # bottom_layer:             # 下层参数
    #   c: 8000.0
    #   phi: 35.0
    #   phib: 20.0
    #   gamma_s: 21000.0
    #   K_sat: 5.0e-6
    #   theta_sat: 0.40
    #   theta_res: 0.05
    #   theta_ini: 0.18
    #   alpha: 1.5
    #   diffusivity: 5.0e-7


# ================================================================
#  水文参数 (Green-Ampt入渗模型，单层模式下使用)
# ================================================================

hydrology:
  K_sat: 1.0e-5              # 饱和渗透系数 (m/s)
  theta_s: 0.45              # 饱和含水率
  theta_i: 0.20              # 初始含水率
  psi_f: 0.10                # 湿润锋吸力水头 (m)


# ================================================================
#  流变学参数
# ================================================================

rheology:
  n_manning: 0.05            # Manning糙率系数
  alpha1: 0.0765             # 二次模型参数 α1 (屈服应力)
  beta1: 10.11               # 二次模型参数 β1 (屈服应力指数)
  alpha2: 0.0538             # 二次模型参数 α2 (粘度)
  beta2: 17.48               # 二次模型参数 β2 (粘度指数)
  rho_water: 1000.0          # 水密度 (kg/m³)
  rho_sediment: 2650.0       # 泥沙密度 (kg/m³)
  Cv_threshold: 0.2          # 浓度阈值 (清水↔泥石流切换)
  Cv_max: 0.65               # 最大体积浓度


# ================================================================
#  侵蚀/沉积参数
# ================================================================

erosion:
  tau_c: 10.0                # 临界剪切应力 (Pa)
  k_erosion: 1.0e-5          # 侵蚀系数 (m/s/Pa)
  v_critical: 0.5            # 沉积临界流速 (m/s)
  k_deposition: 0.1          # 沉积系数


# ================================================================
#  计算参数
# ================================================================

compute:
  backend: "auto"            # auto | cuda | cpu | vulkan
  use_double_precision: false
